server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ── Rutas de la SPA ─────────────────────────────────────────────────────
    # La aplicación resuelve las rutas en el cliente (App.tsx lee
    # window.location.pathname). Sin este fallback, entrar directo a
    # /external?qr=... devolvería 404 en vez de cargar la app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Caché ───────────────────────────────────────────────────────────────
    # Los assets llevan hash en el nombre (index-DsUzdyxc.js), así que se
    # pueden cachear para siempre. El index.html NO: es quien apunta a los
    # assets nuevos tras cada despliegue.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Compresión ──────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/wasm;

    # ── Cabeceras de seguridad ──────────────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # La cámara es imprescindible: lector de QR y reconocimiento facial.
    add_header Permissions-Policy        "camera=(self), microphone=(), geolocation=()" always;

    # No revelar la versión de nginx.
    server_tokens off;

    # El bundle mayor ronda 1.5 MB; sin esto las subidas de foto fallan.
    client_max_body_size 10m;
}
