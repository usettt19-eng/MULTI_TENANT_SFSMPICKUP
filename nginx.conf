server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ── API interna ─────────────────────────────────────────────────────────
    # DEBE ir antes del fallback de la SPA. Si no, /api/... cae en
    # try_files -> index.html, y el frontend recibe HTML donde espera JSON:
    # ese era el error "Unexpected token '<', "<html>... is not valid JSON".
    #
    # El resolver de Docker (127.0.0.11) más la variable fuerzan que nginx
    # resuelva el nombre en cada petición: si el contenedor `api` se reinicia
    # con otra IP, no se queda con la vieja cacheada.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La cabecera Authorization lleva el JWT: sin ella el backend da 401.
        proxy_set_header Authorization     $http_authorization;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;   # las importaciones masivas tardan

        # Si el backend está caído, devolver JSON y no la página HTML de nginx,
        # para que el frontend muestre un mensaje entendible.
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_down;
    }

    location @api_down {
        default_type application/json;
        return 503 '{"success":false,"error":"El servicio de API no está disponible."}';
    }

    # ── Rutas de la SPA ─────────────────────────────────────────────────────
    # La aplicación resuelve las rutas en el cliente (App.tsx lee
    # window.location.pathname). Sin este fallback, entrar directo a
    # /external?qr=... devolvería 404 en vez de cargar la app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Caché ───────────────────────────────────────────────────────────────
    # Los assets llevan hash en el nombre (index-DsUzdyxc.js), así que se
    # pueden cachear para siempre. El index.html NO: es quien apunta a los
    # assets nuevos tras cada despliegue.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Compresión ──────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/wasm;

    # ── Cabeceras de seguridad ──────────────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # La cámara es imprescindible: lector de QR y reconocimiento facial.
    add_header Permissions-Policy        "camera=(self), microphone=(), geolocation=()" always;

    # No revelar la versión de nginx.
    server_tokens off;

    # El bundle mayor ronda 1.5 MB; sin esto las subidas de foto fallan.
    client_max_body_size 10m;
}
