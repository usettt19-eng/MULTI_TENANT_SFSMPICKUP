services:
  sfsmpickup:
    build:
      context: .
      dockerfile: Dockerfile
      # Vite empotra estas variables al construir. Cambiarlas exige
      # `docker compose build`, no basta con reiniciar el contenedor.
      args:
        VITE_SUPABASE_URL:      ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_WELLNESS_API_URL:  ${VITE_WELLNESS_API_URL:-}
        GEMINI_API_KEY:         ${GEMINI_API_KEY:-}
    image: sfsmpickup:latest
    container_name: sfsmpickup
    restart: unless-stopped
    ports:
      # Escucha SOLO en localhost por defecto. Docker publica los puertos
      # saltándose las reglas INPUT de iptables, así que un "8095:80" a secas
      # deja la aplicación accesible desde internet por HTTP plano — y por ahí
      # viajan las sesiones de padres y personal.
      # Hacia fuera se publica con TLS a través del proxy inverso.
      # Verifica antes que el puerto esté libre:  ss -tulnp | grep 8095
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8095}:80"
    # Tope de memoria para que un pico aquí no afecte a Supabase ni a los
    # demás proyectos de la máquina. nginx sirviendo estáticos consume poco.
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
