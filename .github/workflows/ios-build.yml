name: Build iOS (validation)

# Compila el proyecto de iOS para el Simulador, SIN firmar. Sirve para
# confirmar que el proyecto Capacitor/Xcode está sano en cada cambio.
# No genera un .ipa instalable en un iPhone real ni sube nada a TestFlight
# -- eso requiere firma con un certificado del Apple Developer Program,
# que todavía no está configurada (ver notas en el repo/README).
on:
  workflow_dispatch:
  push:
    branches: [claude/tenant-isolation-rls, main]
    paths:
      - 'ios/**'
      - 'src/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/ios-build.yml'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el frontend
        run: npx vite build

      - name: Sincronizar assets web con el proyecto iOS
        run: npx cap sync ios

      - name: Compilar para el Simulador (sin firma)
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
