<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1/user-scalable=no: sin esto, iOS Safari/WKWebView
    hace zoom automático a TODA la página al tocar cualquier input con
    letra menor a 16px (varios de esta app usan text-sm, 14px) — y si ese
    zoom no se deshace solo, la pantalla queda "expandida", empujando
    menús y botones fuera del área visible/táctil. En Android no pasa
    porque Chrome no tiene ese comportamiento de auto-zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- La app es siempre clara — sin esto, cuando el celular está en modo
    oscuro del sistema, algunos navegadores (Chrome/Firefox en Android)
    "oscurecen" automáticamente el contenido de páginas que no declaran su
    esquema de color, y ese re-coloreado automático puede fallar en
    elementos con fondo oscuro propio (como los botones bg-primary),
    dejando el texto ilegible aunque el CSS esté bien. -->
    <meta name="color-scheme" content="light" />
    <!-- Título/descripción/OG por defecto para cualquier ruta que no los
    sobreescriba por JS (LandingPage.tsx sí lo hace, con contenido más
    específico) — sirve de respaldo para bots que no ejecutan JS y para
    vistas previas de enlace (WhatsApp, redes) antes de que hidrate React. -->
    <title>Safe Smart Pickup — Recogida Escolar Segura para Colegios</title>
    <meta name="description" content="Plataforma para colegios que gestiona la recogida escolar, bus, bienestar de los alumnos, formularios y reportes, con app para padres en Android e iOS." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Safe Smart Pickup" />
    <meta property="og:title" content="Safe Smart Pickup — Recogida Escolar Segura para Colegios" />
    <meta property="og:description" content="Plataforma para colegios que gestiona la recogida escolar, bus, bienestar de los alumnos, formularios y reportes, con app para padres en Android e iOS." />
    <meta property="og:image" content="https://safesmartpickup.com/logo.png" />
    <meta property="og:url" content="https://safesmartpickup.com/LandingPage" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Safe Smart Pickup — Recogida Escolar Segura para Colegios" />
    <meta name="twitter:description" content="Plataforma para colegios que gestiona la recogida escolar, bus, bienestar de los alumnos, formularios y reportes, con app para padres en Android e iOS." />
    <meta name="twitter:image" content="https://safesmartpickup.com/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
