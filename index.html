<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1/user-scalable=no: sin esto, iOS Safari/WKWebView
    hace zoom automático a TODA la página al tocar cualquier input con
    letra menor a 16px (varios de esta app usan text-sm, 14px) — y si ese
    zoom no se deshace solo, la pantalla queda "expandida", empujando
    menús y botones fuera del área visible/táctil. En Android no pasa
    porque Chrome no tiene ese comportamiento de auto-zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- La app es siempre clara — sin esto, cuando el celular está en modo
    oscuro del sistema, algunos navegadores (Chrome/Firefox en Android)
    "oscurecen" automáticamente el contenido de páginas que no declaran su
    esquema de color, y ese re-coloreado automático puede fallar en
    elementos con fondo oscuro propio (como los botones bg-primary),
    dejando el texto ilegible aunque el CSS esté bien. -->
    <meta name="color-scheme" content="light" />
    <title>Safe_Smart_Pickup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
